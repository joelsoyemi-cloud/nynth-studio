const stories=[{"id":"michael-spyder","category":"NYNTH Ambassador","title":"Michael Spyder: journey across Africa.","summary":"Passion. Strength. Belief. A journey through the lens of Stay Above.","image":"https://res.cloudinary.com/dqouigbvm/image/upload/f_auto,q_auto,w_800/v1784496152/xrrdqjclbt7azmjvc6c7.jpg"},{"id":"winners","category":"Product stories","title":"The world only needs winners.","summary":"A statement you wear. A mindset you live. Inside the NYNTH Winners collection.","image":"https://res.cloudinary.com/dqouigbvm/image/upload/f_auto,q_auto,w_2000/v1790062933/dhqkyrnzt5334bzekhev.jpg"},{"id":"uniform","category":"Style","title":"Same statement. Your own uniform.","summary":"Let the tee do the talking. Three ways to make it yours.","image":"https://res.cloudinary.com/dqouigbvm/image/upload/f_auto,q_auto,w_800/v1783796871/vk8d2pfccu500f8xnj4z.jpg"},{"id":"white","category":"Product stories","title":"A fresh take on the white tee.","summary":"An everyday starting point, with an unmistakable NYNTH identity.","image":"https://res.cloudinary.com/dqouigbvm/image/upload/f_auto,q_auto,w_800/v1790062118/ib9s1oh4rt2dotaxpn7z.jpg"},{"id":"details","category":"Style","title":"Wear the statement.","summary":"The NYNTH Winners tee: a bold message in your everyday rotation.","image":"https://res.cloudinary.com/dqouigbvm/image/upload/f_auto,q_auto,w_800/v1783796006/ced9jfcczep8h24h7ggj.jpg"},{"id":"sound","category":"Culture","title":"Find your own rhythm.","summary":"Where personal style and music share a point of view.","image":null},{"id":"city","category":"Culture","title":"Dress for the city. Make room for yourself.","summary":"Personal style beyond the trend cycle.","image":null}],copy={"winners":["Some pieces say everything before you say a word. The Winners tee puts a bold message at the centre of an everyday silhouette.","Start with the statement. Keep the rest personal: relaxed denim, your favourite trainers, a cap you reach for without thinking. The point is to make the piece part of your own story.","Explore the NYNTH World store for current colours, sizes and availability."],"uniform":["One graphic tee can move through different versions of your day. Try relaxed denim for an everyday fit, straight trousers for a cleaner silhouette, or an open overshirt when the evening cools down.","Give a strong graphic room to breathe. Repeat one colour from the print in a small detail, then keep everything else simple.","Personal style happens in the choices between the pieces. Wear what feels natural and let the fit be yours."],"white":["A white tee is a starting point. Pair it with faded denim, darker trousers or a bright accessory to shift the mood.","The Pop White piece brings the NYNTH World mark into that everyday rotation. Make it a foundation, then bring your own point of view.","Visit the store for product information and available sizes."],"details":["The Winners tee puts its message front and centre: The World Only Needs Winners. Oversized lettering gives the piece its visual focus.", "Wear it with simple denim or plain trousers to give the graphic room. Add an open layer for a different look while keeping the message visible.", "Find current sizes, colours and product details in the NYNTH World store."],"sound":["Both music and personal style begin with a point of view. A rhythm, a colour, a feeling you want to hold onto.","This corner of the journal makes room for the connection between what we listen to and what we wear. Future stories will bring the artists and their own words into focus."],"city":["Start with the day you actually have. Choose pieces you can move in, consider the weather, and build from there.","Your style does not need a new trend every week. It needs a few pieces you return to, worn in ways that feel like you."]};
